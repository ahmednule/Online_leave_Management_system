{% extends "users/base.html" %}

{% block login_content %}
<div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <div class="bg-success bg-opacity-10 rounded-circle p-3 d-inline-block mb-3">
                <i class="bi bi-check-circle text-success" style="font-size: 2rem;"></i>
            </div>
            <h4 class="fw-700 mb-1">Password Reset Complete</h4>
            <p class="text-secondary mb-0" style="font-size: 0.9rem;">Your password has been successfully reset. You can now log in with your new password.</p>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-500">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
